name: test plugin
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run the plugin's tests on PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04 # public repository: GitHub-hosted minutes are free
    strategy:
      matrix:
        php: ['8.3', '8.5']
    container: php:${{ matrix.php }}-cli-alpine
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4
      - name: Check every PHP file's syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Run the tests
        run: php tests/run.php
